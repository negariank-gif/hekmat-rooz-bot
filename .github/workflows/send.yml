name: Send Libro

on:
  schedule:
    - cron: '30 3 * * *'
    - cron: '30 8 * * *'
    - cron: '30 13 * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python bot.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      - name: Save sent log
        run: |
          git config user.email "bot@sanchobook.com"
          git config user.name "LibroBot"
          git add sent_log.json || true
          git commit -m "update sent log" || true
          git push || true
